; Line wrapping stays off (MaxColumnWidth=-1) because qmlformat 6.11 corrupts
; some files when it wraps. tools/format.sh checks line length instead.
[General]
FunctionsSpacing=false
GroupAttributesTogether=false
IndentWidth=4
MaxColumnWidth=-1
NewlineType=unix
NormalizeOrder=false
ObjectsSpacing=false
SemicolonRule=always
SingleLineEmptyObjects=false
SortImports=false
UseTabs=false
